plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.3'
}

group = 'com.aether'
version = '0.1.0-SNAPSHOT'
description = 'AETHER personal intelligence platform API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(
            'org.springframework.boot:spring-boot-dependencies:4.1.3'
    )

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // API documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // General testing support
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Spring MVC testing support
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // In-memory database for integration tests
    testRuntimeOnly 'com.h2database:h2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.aether.platform.AetherApiApplication'
}