spring:
  datasource:
    url: ${AETHER_DB_URL}
    username: aether_app
    password: ${AETHER_DB_PASSWORD}
    hikari:
      pool-name: AetherApiPool
      connection-init-sql: SET search_path TO aether, public
      maximum-pool-size: ${AETHER_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${AETHER_DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 120000

  flyway:
    enabled: true
    url: ${AETHER_FLYWAY_URL:${AETHER_DB_URL}}
    user: aether_migrator
    password: ${AETHER_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    schemas: aether
    default-schema: aether
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

  sql:
    init:
      mode: never

  mail:
    host: ${AETHER_SMTP_HOST}
    port: ${AETHER_SMTP_PORT:587}
    username: ${AETHER_SMTP_USERNAME}
    password: ${AETHER_SMTP_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: logstash

aether:
  identity:
    email:
      from: ${AETHER_MAIL_FROM}