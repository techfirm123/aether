spring:
  datasource:
    url: jdbc:h2:mem:aether_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-schema.sql
      continue-on-error: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false